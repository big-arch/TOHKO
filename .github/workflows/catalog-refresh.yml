name: Refresh Loretta catalogue daily
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: write
concurrency:
  group: loretta-catalogue-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check 'Pillow>=11.3,<13'
      - name: Verify catalogue parser
        run: python -m unittest discover -s qa/catalog18-import -p 'test_parser.py'
      - name: Restore source cache
        uses: actions/cache/restore@v5
        with:
          path: qa/catalog18-import/http-cache
          key: loretta-daily-source-v1-${{ github.run_id }}
          restore-keys: |
            loretta-daily-source-v1-
            loretta-review-source-v1-
      - name: Refresh all catalogue sections
        id: collect
        continue-on-error: true
        run: timeout --signal=INT 35m python -X utf8 scripts/collect-catalog18.py --deployed https://big-arch.github.io/TOHKO/ --refresh --workers 4 --transport curl --request-interval 1
      - name: Save source cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: qa/catalog18-import/http-cache
          key: loretta-daily-source-v1-${{ github.run_id }}
      - name: Retain collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loretta-daily-coverage
          path: |
            qa/catalog18-import/coverage-report.json
            qa/catalog18-import/crawl-progress.json
            qa/catalog18-import/restore-error.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve complete catalogue for the next site publication
        if: steps.collect.outcome == 'success'
        run: |
          # Both tracked audit snapshots are written by the collector. Include
          # them so the following rebase has no leftover tracked changes.
          git add -- tights-guide/data/catalog.json tights-guide/assets/catalog qa/catalog18-import/coverage-report.json qa/catalog18-import/catalog-candidate.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: refresh dated Loretta catalogue'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report failed refresh without replacing the published catalogue
        if: steps.collect.outcome == 'failure'
        run: |
          echo '::error::Source refresh incomplete. The published catalogue and its original check dates are retained.'
          exit 1

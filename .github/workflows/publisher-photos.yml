name: Refresh publisher photographs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publisher-photos.yml'
      - '.github/workflows/pages.yml'
      - 'scripts/auto_content.py'
      - 'scripts/content-sources.json'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publisher-photos
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11.3,<13'
      - name: Verify collector and failure recovery
        run: python -m unittest discover -s scripts/tests -v
      - name: Refresh official publisher photographs
        run: |
          python scripts/auto_content.py
          python scripts/optimize-images.py
      - name: Save the verified photograph snapshot
        run: |
          git add tights-guide/data/publisher-feed.json tights-guide/data/editorial-media.json tights-guide/data/photos.js tights-guide/assets/updates tights-guide/assets/responsive
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'content: refresh official publisher photographs'
            git push origin HEAD:main
          fi
  publish:
    needs: collect
    uses: ./.github/workflows/pages.yml

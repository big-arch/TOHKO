name: Publish TONKO
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check local links and JavaScript
        run: |
          python scripts/check-site.py
          find tights-guide -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: tights-guide
      - uses: actions/deploy-pages@v4
        id: deployment

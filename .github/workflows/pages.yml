name: Publish TONKO
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '9,24,39,54 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install catalogue image dependency
        run: python -m pip install --disable-pip-version-check 'Pillow>=11.3,<13'
      - name: Restore the latest complete dated catalogue
        run: python scripts/collect-catalog18.py --deployed https://big-arch.github.io/TOHKO/ --restore-only
      - name: Refresh official USD reference rate
        continue-on-error: true
        run: python scripts/update-exchange-rate.py --deployed
      - name: Refresh public videos
        run: python scripts/update-videos.py --deployed
      - name: Refresh fashion headlines
        run: python scripts/update-news.py --deployed
      - name: Refresh existing article metadata and covers without paid AI
        env:
          OPENAI_NEWS_ENABLED: 'false'
        run: python scripts/enrich-news.py
      - name: Build news and packaging pages
        run: |
          python scripts/build-catalog-links.py
          python scripts/build-catalog.py
          python scripts/build-packaging.py
          python scripts/build-videos.py
          python scripts/build-style-photos.py
          python scripts/build-guide-studio.py
          python scripts/free_news.py --merge-only
          python scripts/build-home-news.py
          python scripts/build-live-sections.py
          python scripts/build-editorial-updates.py
          python scripts/build-journal-series.py
          python scripts/link-catalog.py
          python scripts/build-assistant.py --inject
      # Recovery snapshots update data independently of generated HTML. Verify the built edition.
      - name: Verify content and assistant
        run: |
          python -m unittest discover -s scripts/tests -v
          python -m unittest qa.test_live_sections
          python -m unittest qa.test_free_news
          python -m unittest qa.test_guide_editorial
          python -m unittest qa.test_journal_series
          python -m unittest discover -s qa -p 'test_news*.py'
          node qa/test_video_memory.cjs
          node --test qa/test_assistant.cjs qa/test_assistant_cache.cjs qa/test_assistant14.cjs
          python -m unittest qa/test_assistant_build.py
          python -m unittest qa/test_video_feed.py qa/test_video15.py qa/test_video16.py qa/test_video17.py
          python -m unittest qa/test_exchange18.py qa/test_catalog18_links.py qa/test_catalog18_ui.py
          python -m unittest discover -s qa/catalog18-import -p 'test_parser.py'
          node --test qa/test_catalog18_ui.cjs
      - name: Check local links and JavaScript
        run: |
          python scripts/check-site.py
          find tights-guide -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: tights-guide
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      # Pages can briefly return an empty artifact list immediately after upload.
      # Retry deployment only, without uploading a duplicate artifact or recollecting feeds.
      - name: Wait before one publication retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 10
      - uses: actions/deploy-pages@v4
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
  snapshot:
    needs: deploy
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Check recovery snapshot interval
        id: due
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct -- tights-guide/data/news.json tights-guide/data/videos.json tights-guide/data/video-feed-state.json) ))
          if [ "$age" -ge 604800 ]; then echo 'save=true' >> "$GITHUB_OUTPUT"; fi
      - name: Preserve published feed history
        if: ${{ steps.due.outputs.save == 'true' }}
        run: |
          python scripts/save-published-snapshot.py
          git add tights-guide/data/news.json tights-guide/data/videos.json tights-guide/data/video-feed-state.json tights-guide/assets/videos-new tights-guide/data/catalog.json tights-guide/data/exchange-rate.json tights-guide/assets/catalog
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: preserve published TONKO feed snapshot'
            git push origin HEAD:main
          fi

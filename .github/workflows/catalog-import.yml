name: Collect Loretta catalogue for review
on:
  push:
    branches: [codex/loretta-catalog-20261117]
    paths:
      - scripts/collect-catalog18.py
      - qa/catalog18-import/test_parser.py
      - qa/catalog18-import/measure_image_transport.py
      - .github/workflows/catalog-import.yml
  workflow_dispatch:
permissions:
  contents: write
env:
  CATALOG_IMAGES: 'false'
concurrency:
  group: loretta-review-import
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/codex/loretta-catalog-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/loretta-catalog-20261117
      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check 'Pillow>=11.3,<13'
      - name: Verify public catalogue parser
        run: python -m unittest discover -s qa/catalog18-import -p 'test_parser.py'
      - name: Restore resumable source cache
        uses: actions/cache/restore@v5
        with:
          path: qa/catalog18-import/http-cache
          key: loretta-review-source-v1-${{ github.run_id }}
          restore-keys: loretta-review-source-v1-
      - name: Collect public model facts for early review
        id: listings
        continue-on-error: true
        run: timeout --signal=INT 20m python -X utf8 scripts/collect-catalog18.py --workers 4 --resume --no-images --initial-image-manifest qa/catalog18-import/initial-images-manifest.json
      - name: Measure public image delivery before the remaining large download
        if: steps.listings.outcome == 'success'
        run: python -X utf8 qa/catalog18-import/measure_image_transport.py
      - name: Preserve completed model facts before image collection
        if: steps.listings.outcome == 'success'
        run: |
          git add -- tights-guide/data/catalog.json qa/catalog18-import/coverage-report.json qa/catalog18-import/initial-images-resolved.json qa/catalog18-import/network-probe.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Preserve complete Loretta model facts for review'
            git push origin HEAD:codex/loretta-catalog-20261117
          fi
      - name: Collect public model photographs
        id: collect
        if: steps.listings.outcome == 'success' && env.CATALOG_IMAGES == 'true'
        continue-on-error: true
        run: timeout --signal=INT 70m python -X utf8 scripts/collect-catalog18.py --workers 4 --resume
      - name: Preserve resumable cache after any collection outcome
        if: always()
        uses: actions/cache/save@v5
        with:
          path: qa/catalog18-import/http-cache
          key: loretta-review-source-v1-${{ github.run_id }}
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loretta-coverage
          path: |
            qa/catalog18-import/catalog-candidate.json
            qa/catalog18-import/coverage-report.json
            qa/catalog18-import/crawl-progress.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save collected files on the review branch
        if: always()
        run: |
          if [ -f tights-guide/data/catalog.json ]; then git add -- tights-guide/data/catalog.json; fi
          if [ -d tights-guide/assets/catalog ]; then git add -- tights-guide/assets/catalog; fi
          if [ -f qa/catalog18-import/coverage-report.json ]; then git add -- qa/catalog18-import/coverage-report.json; fi
          if [ ! -f tights-guide/data/catalog.json ] && [ -f qa/catalog18-import/catalog-candidate.json ]; then git add -f -- qa/catalog18-import/catalog-candidate.json; fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Collect Loretta models and images for review'
            git push origin HEAD:codex/loretta-catalog-20261117
          fi
      - name: Report incomplete collection
        if: steps.listings.outcome == 'failure' || steps.collect.outcome == 'failure'
        run: |
          echo '::error::Catalogue incomplete. Review the coverage report; no site deployment was requested.'
          exit 1
